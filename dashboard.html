<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — DARKNESS ESPORTS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar">
  <div class="container navbar-inner">
    <a href="index.html" class="brand"><span class="brand-mark"></span>DARKNESS<span>&nbsp;ESPORTS</span></a>
    <ul class="nav-links"></ul>
    <div class="nav-actions"></div>
    <button class="nav-toggle" aria-label="Toggle menu"><span></span><span></span><span></span></button>
  </div>
</nav>

<div id="dashboardRoot">
  <section class="section" style="border-bottom:none;">
    <div class="container">
      <div class="section-eyebrow">Player Dashboard</div>
      <h2 style="margin-bottom:6px;">Welcome, <span id="welcomeName">—</span></h2>
      <p class="mono" style="color:var(--muted);margin-bottom:6px;" id="welcomeUsername">@—</p>
      <span class="status-pill" id="welcomeStatus">—</span>

      <div class="grid grid-3" style="margin-top:44px;">
        <div class="hud-card">
          <div class="hud-corner"></div>
          <h4 style="font-size:1rem;margin-bottom:10px;">Profile</h4>
          <p style="color:var(--muted);font-size:0.9rem;">Full profile fields (IGN, UID, role, region, bio) arrive in Phase 2.</p>
        </div>
        <div class="hud-card">
          <div class="hud-corner"></div>
          <h4 style="font-size:1rem;margin-bottom:10px;">Team</h4>
          <p style="color:var(--muted);font-size:0.9rem;">Team creation and lineup management arrive in Phase 3.</p>
        </div>
        <div class="hud-card">
          <div class="hud-corner"></div>
          <h4 style="font-size:1rem;margin-bottom:10px;">Tournaments</h4>
          <p style="color:var(--muted);font-size:0.9rem;">Tournament registration arrives in Phase 4.</p>
        </div>
      </div>

      <button class="btn btn-ghost" id="logoutBtn" style="margin-top:44px;">Logout</button>
    </div>
  </section>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/main.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
