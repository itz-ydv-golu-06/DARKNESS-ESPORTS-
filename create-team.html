<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Team — DARKNESS ESPORTS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar">
  <div class="container navbar-inner">
    <a href="index.html" class="brand"><span class="brand-mark"></span>DARKNESS<span>&nbsp;ESPORTS</span></a>
    <ul class="nav-links">
      <li><a href="teams.html">Teams</a></li>
      <li><a href="index.html#lineup">Lineup</a></li>
      <li><a href="index.html#tournaments">Tournaments</a></li>
      <li><a href="index.html#recruitment">Recruitment</a></li>
      <li><a href="index.html#results">Results</a></li>
    </ul>
    <div class="nav-actions"></div>
    <button class="nav-toggle" aria-label="Toggle menu"><span></span><span></span><span></span></button>
  </div>
</nav>

<div class="auth-wrap" id="createTeamRoot">
  <div class="auth-card">
    <h1>Create a Team</h1>
    <p class="sub">You'll become the team captain.</p>

    <div class="form-alert" id="createTeamAlert"></div>

    <form id="createTeamForm" novalidate>
      <div class="avatar-picker">
        <div class="avatar-preview" id="teamLogoPreview">?</div>
        <div class="field" style="flex:1;margin-bottom:0;">
          <label for="teamLogoUrl">Team Logo URL <span style="text-transform:none;">(optional)</span></label>
          <input type="url" id="teamLogoUrl" placeholder="https://...">
        </div>
      </div>

      <div class="field" id="field-teamName">
        <label for="teamName">Team Name</label>
        <input type="text" id="teamName" placeholder="Darkness Prime" required>
        <div class="field-error"></div>
      </div>

      <div class="field" id="field-teamTag">
        <label for="teamTag">Team Tag</label>
        <input type="text" id="teamTag" placeholder="DRKN" maxlength="6" required>
        <div class="field-hint">2-6 letters/numbers, shown as [TAG].</div>
        <div class="field-error"></div>
      </div>

      <div class="field" id="field-teamDesc">
        <label for="teamDesc">Description</label>
        <textarea id="teamDesc" rows="3" placeholder="What's this team about?"></textarea>
        <div class="field-error"></div>
      </div>

      <div class="field" id="field-teamContact">
        <label for="teamContact">Contact Info</label>
        <input type="text" id="teamContact" placeholder="Discord: darkness#0001" required>
        <div class="field-error"></div>
      </div>

      <button type="submit" class="btn btn-primary btn-block">Create Team</button>
    </form>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/main.js"></script>
<script src="js/auth.js"></script>
<script src="js/teams.js"></script>
</body>
</html>
